workflows:
  screenlingo-unsigned-ipa:
    name: ScreenLingo unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_SCHEME: ScreenLingo
        XCODE_WORKSPACE: ScreenLingo.xcworkspace
        XCODE_PROJECT: ScreenLingo.xcodeproj
      xcode: latest
    scripts:
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          pod install --repo-update
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          if [[ -d "$XCODE_WORKSPACE" ]]; then
            xcodebuild \
              -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              IPHONEOS_DEPLOYMENT_TARGET=16.0 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
          else
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              IPHONEOS_DEPLOYMENT_TARGET=16.0 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
          fi
      - name: Package IPA
        script: |
          set -euo pipefail
          chmod +x scripts/package_ipa.sh
          DERIVED_DATA_PATH="$CM_BUILD_DIR/build" \
          IPA_OUTPUT="$CM_BUILD_DIR/ScreenLingo.ipa" \
          scripts/package_ipa.sh
    artifacts:
      - ScreenLingo.ipa
      - build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
